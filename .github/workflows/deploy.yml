# Every push to main updates the server automatically (about 1–2 minutes).
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#   SERVER_HOST   the server's public IP
#   SERVER_USER   ubuntu
#   SERVER_SSH_KEY   the private key of the deploy key pair (see README step 6)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: cd ~/hyperplane && bash deploy/deploy.sh
