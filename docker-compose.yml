# Hyperplane — one command runs everything:   docker compose up -d --build
#   web     Caddy: the dashboard + HTTPS + /api proxy          (ports 80, 443)
#   api     FastAPI backend                                     (internal)
#   worker  scheduled + "Sync now" ChartInk collections         (internal)
#   db      PostgreSQL 16 (Alpine, tuned small)                 (internal)
#   backup  nightly database dump into ./backups                (internal)

x-app: &app
  build: ./backend
  image: hyperplane-backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://hyperplane:${POSTGRES_PASSWORD}@db:5432/hyperplane
    CONFIG_PATH: /config/config.ini
    DATA_DIR: /data
    TZ: Asia/Kolkata
  volumes:
    - ./config.ini:/config/config.ini:ro
    - ./data/files:/data
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    build: ./frontend
    image: hyperplane-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./data/caddy:/data
    depends_on:
      - api
    mem_limit: 128m

  api:
    <<: *app
    mem_limit: 512m

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    shm_size: "1gb"            # Chromium needs shared memory
    mem_limit: 2g

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hyperplane
      POSTGRES_USER: hyperplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kolkata
    # "lite" settings: ~100 MB of RAM
    command: >
      postgres -c shared_buffers=64MB -c effective_cache_size=256MB -c work_mem=4MB
               -c maintenance_work_mem=32MB -c max_connections=30 -c wal_buffers=4MB
               -c timezone=Asia/Kolkata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperplane -d hyperplane"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kolkata
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  # Optional: keeps your DuckDNS name pointing at this server. Starts only with:
  #   docker compose --profile duckdns up -d
  duckdns:
    image: alpine:3.20
    profiles: ["duckdns"]
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    entrypoint: ["sh", "-c", "apk add --no-cache curl >/dev/null && while true; do curl -fsS \"https://www.duckdns.org/update?domains=$${DUCKDNS_SUBDOMAIN}&token=$${DUCKDNS_TOKEN}&ip=\" && echo; sleep 300; done"]
    mem_limit: 64m
