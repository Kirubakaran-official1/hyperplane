<body>
<div id="root"><!-- round 27e: shown while the app loads (React replaces it); the same dark as the Android splash, so opening flows logo → app -->
<div class="hp-boot" role="status" aria-label="Loading Hyperplane">
<style>
.hp-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 80% at 50% 35%,#10213f 0%,#070d1a 60%);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;z-index:9999}
.hp-boot svg{width:84px;height:84px;filter:drop-shadow(0 10px 30px rgba(34,211,238,.25));animation:hpBootIn .5s ease-out both}
.hp-boot b{font-size:22px;font-weight:700;letter-spacing:.5px;color:#e2e8f0;animation:hpBootIn .5s .08s ease-out both}
.hp-boot small{margin-top:-12px;font-size:13px;color:#94a3b8;animation:hpBootIn .5s .14s ease-out both}
.hp-boot i{position:relative;width:120px;height:3px;border-radius:2px;background:rgba(148,163,184,.18);overflow:hidden;margin-top:6px}
.hp-boot i::after{content:"";position:absolute;inset:0;width:40%;border-radius:2px;background:linear-gradient(90deg,#22d3ee,#6366f1);animation:hpBootBar 1.1s ease-in-out infinite}
@keyframes hpBootIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes hpBootBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.hp-boot *,.hp-boot i::after{animation:none}}
</style>
