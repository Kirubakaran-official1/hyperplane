# Copy to config.ini on the server:  cp config.example.ini config.ini   then edit.
# This file is never committed to GitHub.

[app]
# Long random text. Generate one with:  openssl rand -hex 32
secret_key = change-me
# How long a login stays valid, in hours
session_hours = 72

[users]
# One line per user:   user_id = password            (can view)
#                      user_id = password, admin     (can also use the Admin tab)
# Changes are picked up automatically — no restart needed.
kirubakaran = ChangeThisPassword!, admin

[telegram]
# Leave NIL to skip Telegram. Turn sending on/off in Admin.
bot_token = NIL
chat_id = NIL

[mail]
# Customer emails ("Forgot password"). Brevo: your name → SMTP & API → SMTP tab (login + "Generate a new SMTP key");
# the sender must be verified (Senders, Domains & Dedicated IPs → Senders). Leave the section out to switch email off.
# Check it in Admin → System & settings → "Send test email".
smtp_host = smtp-relay.brevo.com
smtp_port = 587
smtp_user = PASTE-THE-LOGIN-HERE
smtp_password = PASTE-THE-SMTP-KEY-HERE
from_email = the-verified-sender@example.com
from_name = Hyperplane
# optional: where customers' replies go (e.g. support@your-domain while sending from no-reply@your-domain)
reply_to =
# the address customers open the app at — links in emails start with it (http://localhost when testing on your PC)
public_url = https://your-domain
